[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "second-brain-api"
version = "1.1.1"
description = "AI Second Brain FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "argon2-cffi>=23.1",
  "PyJWT>=2.9",
  "structlog>=24.4",
  "tenacity>=9.0",
  "apscheduler>=3.10",
  "prometheus-client>=0.21",
  "python-multipart>=0.0.9",
  "email-validator>=2.2",
  "httpx>=0.27",
  "chromadb>=0.6",
  "pypdf>=5.0",
  "pypdfium2>=4.30",
  "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "freezegun>=1.5",
  "respx>=0.21",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
