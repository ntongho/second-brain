name: second_brain
description: AI Second Brain — personal RAG knowledge assistant
publish_to: "none"
version: 1.1.1+1

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.7.0
  flutter_secure_storage: 9.2.4
  google_fonts: ^6.2.1
  intl: ^0.20.2
  uuid: ^4.5.1
  shared_preferences: ^2.5.3
  file_picker: 8.3.7
  record: 5.2.1
  just_audio: ^0.9.46
  cross_file: ^0.3.4
  connectivity_plus: ^6.1.4
  google_sign_in: ^6.2.2
  # workmanager is not web-safe (Android/iOS only). Phase 7 drains the outbox
  # on connectivity_plus + app resume instead, so Chrome/web still compiles.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

# record 5.2.1 era. Caret on record_web pulled 1.3.0 (needs streamBufferSize / interface 1.5).
# record_linux 0.7.2 does not implement startStream; interface 1.3+ broke Android compile.
dependency_overrides:
  record_platform_interface: 1.2.0
  record_linux: 0.7.2
  record_web: 1.1.5
  flutter_plugin_android_lifecycle: 2.0.22

flutter:
  uses-material-design: true
  assets:
    - assets/brand/mark-64.png
    - assets/brand/icon-192.png
