name: second_brain
description: AI Second Brain — personal RAG knowledge assistant
publish_to: "none"
version: 1.1.1+1

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.4
  google_fonts: ^6.2.1
  intl: ^0.20.2
  uuid: ^4.5.1
  shared_preferences: ^2.5.3
  file_picker: ^8.3.7
  record: ^5.2.1
  just_audio: ^0.9.46
  cross_file: ^0.3.4
  connectivity_plus: ^6.1.4
  # workmanager is not web-safe (Android/iOS only). Phase 7 drains the outbox
  # on connectivity_plus + app resume instead, so Chrome/web still compiles.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
