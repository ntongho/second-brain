# v1: single-node Compose. Three separate volumes so backup/restore
# can target sqlite / chroma / backups independently (01 §1 infra).
services:
  api:
    build:
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/sqlite/app.db
      CHROMA_PATH: /data/chroma
      BACKUPS_PATH: /data/backups
    volumes:
      - sqlite-data:/data/sqlite
      - chroma-data:/data/chroma
      - backups-data:/data/backups
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  sqlite-data:
  chroma-data:
  backups-data:
